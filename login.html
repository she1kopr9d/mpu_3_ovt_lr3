<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Кофейня «Аромат»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-page">
    <form class="login-form" action="https://httpbin.org/post" method="POST">
      <h1 class="login-form__title">Вход в личный кабинет</h1>
      <div class="form-group">
        <label for="login">Логин</label>
        <input type="text" id="login" name="login" placeholder="Ваш логин" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <label class="checkbox">
        <input type="checkbox" name="remember" value="yes">
        Запомнить меня
      </label>
      <button type="submit" class="btn">Войти</button>
      <p class="login-form__back"><a href="index.html">← На главную</a></p>
    </form>
  </div>
</body>
</html>
